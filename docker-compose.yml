services:
  web:
    build: .
    container_name: fiae-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Use Supabase CLI on host (or hosted Supabase). Inside containers use host.docker.internal for the DB.
      # We force the container to use host.docker.internal regardless of .env to avoid 127.0.0.1 issues.
      DB_CONNECTION_STRING: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      # Client/browser will use NEXT_PUBLIC_SUPABASE_URL from .env (likely http://127.0.0.1:54321).
      # For server-side calls inside the container, we expose SUPABASE_URL_INTERNAL to point to the host.
      SUPABASE_URL_INTERNAL: http://host.docker.internal:54321
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    env_file:
      - .env

