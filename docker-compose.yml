services:
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_ALLOWED_TRAINER_EMAILS=${NEXT_PUBLIC_ALLOWED_TRAINER_EMAILS}
        - GEMINI_API_KEY=${GEMINI_API_KEY}
        - RESEND_API_KEY=${RESEND_API_KEY}
    container_name: fiae-web
    ports:
      - "${APP_PORT:-3002}:3002"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.prod
    environment:
      # These override/add to env_file values
      - "NODE_ENV=production"
      - "NEXT_TELEMETRY_DISABLED=1"
      - "NODE_OPTIONS=--dns-result-order=ipv4first"
    networks:
      - app-network      # For Nginx/Certbot communication
      - ipv6-connector   # For Supabase connection

networks:
  # The shared network for Nginx
  app-network:
    external: true
    name: app-network
  
  # The new network we just created
  ipv6-connector:
    external: true
    name: fiae-ipv6-only

