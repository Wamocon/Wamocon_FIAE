<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LFA-Lernplattform - Wireframe</title>

    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons for a clean icon set -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* Custom styles for a polished look */
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      /* Custom scrollbar for a modern feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #111827; /* bg-gray-900 */
      }
      ::-webkit-scrollbar-thumb {
        background: #374151; /* bg-gray-700 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563; /* bg-gray-600 */
      }

      /* Helper class to hide elements */
      .hidden-view {
        display: none;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-200">
    <!-- 
      =====================================================================
      LOGIN VIEW
      =====================================================================
    -->
    <div
      id="login-view"
      class="flex min-h-screen items-center justify-center bg-gray-900"
    >
      <div
        class="w-full max-w-md space-y-8 rounded-2xl bg-gray-800 p-8 shadow-2xl"
      >
        <div>
          <h2 class="text-center text-4xl font-bold text-white">
            LFA-Lernplattform
          </h2>
          <p class="mt-2 text-center text-gray-400">Willkommen zurück!</p>
        </div>
        <form class="space-y-6" onsubmit="event.preventDefault(); login()">
          <div>
            <label for="email" class="text-sm font-medium text-gray-300"
              >E-Mail-Adresse</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              class="mt-2 w-full rounded-lg border border-gray-600 bg-gray-700 px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
              value="elias.felsing@azubi.de"
            />
          </div>
          <div>
            <label for="password" class="text-sm font-medium text-gray-300"
              >Passwort</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="mt-2 w-full rounded-lg border border-gray-600 bg-gray-700 px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
              value="password123"
            />
          </div>
          <div>
            <button
              type="submit"
              class="w-full rounded-lg bg-blue-600 py-3 font-semibold text-white transition-colors duration-300 hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800 focus:outline-none"
            >
              Anmelden
            </button>
          </div>
        </form>
        <div class="text-center text-sm text-gray-400">
          <p>
            Anmelden als
            <button
              onclick="switchLogin('trainer')"
              class="font-medium text-blue-400 hover:underline"
            >
              Ausbilder
            </button>
          </p>
        </div>
      </div>
    </div>

    <!-- 
      =====================================================================
      MAIN APPLICATION VIEW
      =====================================================================
    -->
    <div id="app-view" class="hidden-view">
      <div class="flex h-screen bg-gray-900">
        <!-- Sidebar -->
        <aside
          class="flex w-64 flex-shrink-0 flex-col border-r border-gray-700/50 bg-gray-900"
        >
          <div
            class="flex h-16 items-center justify-center border-b border-gray-700/50 px-4"
          >
            <i data-lucide="graduation-cap" class="h-8 w-8 text-blue-500"></i>
            <h1 class="ml-2 text-xl font-bold text-white">LFA-Plattform</h1>
          </div>
          <nav id="sidebar-nav" class="flex-1 space-y-1 px-4 py-6"></nav>
          <div class="border-t border-gray-700/50 px-4 py-4">
            <div class="flex items-center">
              <img
                id="user-avatar"
                class="h-10 w-10 rounded-full object-cover"
                src=""
                alt="Avatar"
              />
              <div class="ml-3">
                <p id="user-name" class="text-sm font-medium text-white"></p>
                <p id="user-role" class="text-xs text-gray-400"></p>
              </div>
            </div>
            <button
              onclick="logout()"
              class="mt-4 flex w-full items-center justify-center rounded-md bg-gray-800 px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700"
            >
              <i data-lucide="log-out" class="mr-2 h-4 w-4"></i>
              Abmelden
            </button>
          </div>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content" class="flex flex-1 flex-col overflow-hidden">
          <header
            class="flex h-16 items-center justify-between border-b border-gray-700/50 bg-gray-900 px-6"
          >
            <div id="breadcrumb-container" class="text-sm text-gray-400"></div>
            <div class="flex items-center gap-4">
              <button class="relative text-gray-400 hover:text-white">
                <i data-lucide="bell" class="h-6 w-6"></i>
                <span
                  id="notification-dot"
                  class="absolute -top-1 -right-1 flex h-3 w-3"
                >
                  <span
                    class="absolute inline-flex h-full w-full animate-ping rounded-full bg-red-400 opacity-75"
                  ></span>
                  <span
                    class="relative inline-flex h-3 w-3 rounded-full bg-red-500"
                  ></span>
                </span>
              </button>
              <div id="role-switcher-container"></div>
            </div>
          </header>
          <div
            id="content-area"
            class="flex-1 overflow-y-auto bg-gray-900 p-8"
          ></div>
        </main>
      </div>
    </div>

    <div id="modal-container"></div>

    <script>
      // =====================================================================
      // MOCK DATA
      // =====================================================================
      const mockData = {
        profiles: {
          trainee: {
            id: 'trainee_1',
            fullName: 'Elias Felsing',
            role: 'trainee',
            avatar: 'https://placehold.co/100x100/7c3aed/ffffff?text=E',
            trainerId: 'trainer_1',
            training_start_date: '2025-08-01',
          },
          trainer: {
            id: 'trainer_1',
            fullName: 'Waleri Moretz',
            role: 'trainer',
            avatar: 'https://placehold.co/100x100/1d4ed8/ffffff?text=W',
          },
        },
        curriculum: [
          {
            moduleId: 'mod_1',
            training_year: 1,
            title: 'Grundlagen der Anwendungsentwicklung',
            progress: 75,
            chapters: [
              {
                chapterId: 'chap_1_1',
                title: 'Einführung in die Programmierung',
                lessons: [
                  {
                    id: 'les_1_1_1',
                    title: 'Was ist eine Programmiersprache?',
                    type: 'lesson',
                    completed: true,
                    ref: '§4 Abs. 2 Nr. 1a',
                  },
                  {
                    id: 'les_1_1_2',
                    title: 'Quiz: Grundbegriffe',
                    type: 'quiz',
                    quizId: 'quiz_1_1_2',
                    completed: true,
                    ref: '§4 Abs. 2 Nr. 1a',
                  },
                  {
                    id: 'les_1_1_3',
                    title: 'Praxis: Dein erstes "Hello, World!"',
                    type: 'exercise',
                    completed: true,
                    ref: '§4 Abs. 2 Nr. 1b',
                  },
                ],
                mainQuizId: 'quiz_chap_1_1',
              },
              {
                chapterId: 'chap_1_2',
                title: 'Variablen und Datentypen',
                lessons: [
                  {
                    id: 'les_1_2_1',
                    title: 'Variablen, Datentypen und Operatoren',
                    type: 'lesson',
                    completed: false,
                    ref: '§4 Abs. 2 Nr. 1c',
                  },
                  {
                    id: 'les_1_2_2',
                    title: 'Quiz: Datentypen',
                    type: 'quiz',
                    quizId: 'quiz_1_2_2',
                    completed: false,
                    ref: '§4 Abs. 2 Nr. 1c',
                  },
                ],
                mainQuizId: 'quiz_chap_1_2',
              },
            ],
          },
          {
            moduleId: 'mod_2',
            training_year: 1,
            title: 'Projektmanagement und agile Methoden',
            progress: 40,
            chapters: [
              {
                chapterId: 'chap_2_1',
                title: 'Einführung in Scrum',
                lessons: [],
                mainQuizId: 'quiz_chap_2_1',
              },
            ],
          },
        ],
        quizSubmissions: [
          {
            submissionId: 'sub_1',
            quizId: 'quiz_1_1_2',
            quizTitle: 'Quiz: Grundbegriffe',
            traineeId: 'trainee_1',
            score: 90,
            status: 'reviewed',
            feedback: 'Sehr gute Leistung! Die Grundlagen sitzen.',
            submitted_at: '2025-08-10T10:00:00Z',
          },
          {
            submissionId: 'sub_2',
            quizId: 'quiz_chap_1_1',
            quizTitle: 'Abschlusstest: Einführung',
            traineeId: 'trainee_1',
            score: 75,
            status: 'submitted',
            feedback: null,
            submitted_at: '2025-08-12T14:30:00Z',
          },
        ],
        trainees: [
          {
            id: 'trainee_1',
            name: 'Elias Felsing',
            progress: 75,
            avatar: 'https://placehold.co/100x100/7c3aed/ffffff?text=E',
          },
          {
            id: 'trainee_2',
            name: 'Maanik Garg',
            progress: 90,
            avatar: 'https://placehold.co/100x100/16a34a/ffffff?text=M',
          },
          {
            id: 'trainee_3',
            name: 'Julia Schneider',
            progress: 50,
            avatar: 'https://placehold.co/100x100/f97316/ffffff?text=J',
          },
        ],
      };

      // =====================================================================
      // APPLICATION STATE
      // =====================================================================
      let state = {
        currentUser: null,
        currentView: 'dashboard',
        currentTrainingYear: 1,
        breadcrumbs: [],
      };

      // =====================================================================
      // UI TEMPLATES / VIEWS
      // =====================================================================
      const placeholder = title =>
        `<div class="text-center text-gray-500"><h2 class="text-2xl">${title}</h2><p>Diese Ansicht befindet sich im Aufbau.</p></div>`;

      const views = {
        // --- TRAINEE VIEWS ---
        traineeDashboard: trainingYear => {
          const modulesForYear = mockData.curriculum.filter(
            m => m.training_year === trainingYear
          );
          const nextLesson = mockData.curriculum[0].chapters[1].lessons[0];
          return `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2">
                            <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-blue-500/30 cursor-pointer hover:border-blue-500/70" onclick="navigateTo('lesson', { lessonId: '${nextLesson.id}'})">
                                <h3 class="text-sm font-semibold text-blue-400">WEITERMACHEN</h3>
                                <p class="text-2xl font-bold text-white mt-2">${nextLesson.title}</p>
                                <p class="text-sm text-gray-400 mt-1">Modul: Variablen und Datentypen</p>
                            </div>

                            <h3 class="text-xl font-bold text-white mt-10 mb-4">Mein Lernpfad</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${modulesForYear
                                  .map(
                                    mod => `
                                    <div class="bg-gray-800 p-6 rounded-lg shadow-lg hover:bg-gray-700/50 transition-colors duration-300 cursor-pointer" onclick="navigateTo('moduleDetail', { moduleId: '${mod.moduleId}' })">
                                        <h3 class="font-bold text-xl text-white">${mod.title}</h3>
                                        <p class="text-sm text-gray-400 mt-2">Fortschritt</p>
                                        <div class="w-full bg-gray-700 rounded-full h-2.5 mt-2"><div class="bg-blue-600 h-2.5 rounded-full" style="width: ${mod.progress}%"></div></div>
                                        <p class="text-right text-sm font-semibold mt-2 text-blue-400">${mod.progress}%</p>
                                    </div>
                                `
                                  )
                                  .join('')}
                            </div>
                        </div>
                        <div class="lg:col-span-1 space-y-8">
                             <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                                <h3 class="font-bold text-lg text-white mb-4">Letzte Erfolge</h3>
                                <ul class="space-y-3">
                                    <li class="flex items-center text-sm">
                                        <i data-lucide="award" class="w-5 h-5 text-yellow-400 mr-3"></i>
                                        <span class="text-gray-300">90% im Quiz "Grundbegriffe"</span>
                                    </li>
                                </ul>
                            </div>
                            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                                <h3 class="font-bold text-lg text-white mb-4">Anstehende Termine</h3>
                                <ul class="space-y-3">
                                    <li class="flex items-center text-sm">
                                        <i data-lucide="calendar" class="w-5 h-5 text-red-400 mr-3"></i>
                                        <span class="text-gray-300">Reflektion Q3: 30.09.2025</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
        },

        moduleDetail: moduleId => {
          const module = mockData.curriculum.find(m => m.moduleId === moduleId);
          if (!module) return `<p>Modul nicht gefunden.</p>`;
          return `
                    <div class="space-y-4">
                        ${module.chapters
                          .map(
                            chap => `
                            <div class="bg-gray-800 p-6 rounded-lg shadow-lg cursor-pointer hover:bg-gray-700/50" onclick="navigateTo('chapterDetail', { moduleId: '${moduleId}', chapterId: '${chap.chapterId}' })">
                                <h4 class="font-bold text-lg text-white">${chap.title}</h4>
                                <p class="text-sm text-gray-400 mt-1">${chap.lessons.length} Trainer-Feedback</p>
                            </div>
                        `
                          )
                          .join('')}
                    </div>
                `;
        },

        chapterDetail: (moduleId, chapterId) => {
          const module = mockData.curriculum.find(m => m.moduleId === moduleId);
          const chapter = module?.chapters.find(c => c.chapterId === chapterId);
          if (!chapter) return `<p>Kapitel nicht gefunden.</p>`;
          return `
                    <div class="space-y-3">
                        ${chapter.lessons
                          .map(les => {
                            const submission = mockData.quizSubmissions.find(
                              s => s.quizId === les.quizId
                            );
                            let statusIcon = les.completed
                              ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-green-500"></i>'
                              : '<i data-lucide="circle" class="w-6 h-6 text-gray-600"></i>';
                            if (submission?.status === 'submitted') {
                              statusIcon =
                                '<i data-lucide="loader-circle" class="w-6 h-6 text-yellow-500 animate-spin"></i>';
                            }
                            return `
                            <div class="bg-gray-800 p-4 rounded-lg flex items-center justify-between cursor-pointer hover:bg-gray-700/50" onclick="navigateTo('lesson', { lessonId: '${les.id}' })">
                                <div class="flex items-center">
                                    <i data-lucide="${les.type === 'lesson' ? 'book-open' : les.type === 'exercise' ? 'edit-3' : 'file-question'}" class="w-5 h-5 mr-4 text-blue-400"></i>
                                    <div>
                                        <p class="font-medium text-white">${les.title}</p>
                                        <p class="text-xs text-gray-500">${les.ref}</p>
                                    </div>
                                </div>
                                ${statusIcon}
                            </div>`;
                          })
                          .join('')}
                    </div>
                    <div class="mt-8 bg-blue-800/80 border border-blue-500/50 p-6 rounded-lg flex items-center justify-between cursor-pointer hover:bg-blue-800" onclick="navigateTo('quiz', { quizId: '${chapter.mainQuizId}' })">
                        <div>
                            <h4 class="font-bold text-xl text-white">Abschlusstest: ${chapter.title}</h4>
                            <p class="text-sm text-blue-200">Teste dein Wissen aus diesem Kapitel.</p>
                        </div>
                        <button class="px-6 py-3 font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-500">Quiz starten</button>
                    </div>
                `;
        },

        lesson: lessonId => {
          return `
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-blue-400 font-semibold">Lektion</p>
                                    <h1 class="text-4xl font-bold text-white mt-1">Variablen, Datentypen und Operatoren</h1>
                                </div>
                            </div>
                            <hr class="border-gray-700/50 my-6">
                            
                            <div class="prose prose-invert max-w-none prose-p:text-gray-300 prose-strong:text-white prose-a:text-blue-400">
                                <h2>Was sind Variablen?</h2>
                                <p>In der Programmierung ist eine Variable ein Behälter zur Speicherung von Datenwerten. Stellen Sie es sich wie eine beschriftete Box vor, in die Sie Informationen legen, um sie später wiederzufinden und zu verwenden.</p>
                            </div>

                            <div class="mt-8 pt-6 border-t border-gray-700/50 flex justify-between">
                                 <button onclick="goBack()" class="px-6 py-3 font-semibold text-white bg-gray-700 rounded-lg hover:bg-gray-600">Zurück zum Kapitel</button>
                                 <button class="px-6 py-3 font-semibold text-white bg-green-600 rounded-lg hover:bg-green-700">Als abgeschlossen markieren</button>
                            </div>
                        </div>
                    </div>
                `;
        },

        quiz: quizId => {
          return `
                    <div class="max-w-2xl mx-auto">
                         <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
                            <div class="flex justify-between items-center">
                                <h1 class="text-3xl font-bold text-white">Quiz: Datentypen</h1>
                                <div class="text-lg font-mono tracking-widest bg-gray-900/50 px-4 py-2 rounded-md text-yellow-400">14:59</div>
                            </div>
                            <p class="text-gray-400 mt-2">Frage 1 von 10</p>
                            <hr class="border-gray-700/50 my-6">

                            <div>
                                <h2 class="text-xl font-semibold text-white mb-6">Welcher Datentyp wird verwendet, um eine ganze Zahl zu speichern?</h2>
                                <div class="space-y-4">
                                    <label class="flex items-center p-4 bg-gray-900/50 rounded-lg cursor-pointer hover:bg-gray-700/50 border-2 border-transparent has-[:checked]:border-blue-500 transition-all">
                                        <input type="radio" name="quiz_option" class="h-5 w-5 text-blue-600 bg-gray-700 border-gray-600 focus:ring-blue-500">
                                        <span class="ml-4 text-lg text-gray-200">String</span>
                                    </label>
                                    <label class="flex items-center p-4 bg-gray-900/50 rounded-lg cursor-pointer hover:bg-gray-700/50 border-2 border-transparent has-[:checked]:border-blue-500 transition-all">
                                        <input type="radio" name="quiz_option" class="h-5 w-5 text-blue-600 bg-gray-700 border-gray-600 focus:ring-blue-500">
                                        <span class="ml-4 text-lg text-gray-200">Integer</span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="mt-8 pt-6 border-t border-gray-700/50 flex justify-end">
                                <button class="px-8 py-3 font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700">Nächste Frage</button>
                            </div>
                         </div>
                    </div>
                `;
        },

        knowledgeSubmission: `
                <div class="max-w-3xl mx-auto bg-gray-800 p-8 rounded-lg shadow-lg">
                    <h1 class="text-3xl font-bold text-white">Berufsschul-Inhalte einreichen</h1>
                    <p class="text-gray-400 mt-2">Teile interessante Themen oder Aufgaben aus der Berufsschule mit uns. Wir prüfen diese und nehmen sie ggf. als neue Anforderungen in die Lernplattform auf.</p>
                    <form class="mt-8 space-y-6">
                        <div>
                            <label for="submission_title" class="block text-sm font-medium text-gray-300 mb-2">Thema / Titel</label>
                            <input type="text" id="submission_title" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white" placeholder="z.B. Normalisierung von Datenbanken">
                        </div>
                        <div>
                            <label for="submission_content" class="block text-sm font-medium text-gray-300 mb-2">Beschreibung & Inhalt</label>
                            <textarea id="submission_content" rows="8" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white" placeholder="Beschreibe die Aufgabe oder das Thema so detailliert wie möglich."></textarea>
                        </div>
                         <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Dateien anhängen (optional)</label>
                            <div class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-600 px-6 py-10">
                                <div class="text-center">
                                    <i data-lucide="upload-cloud" class="mx-auto h-12 w-12 text-gray-500"></i>
                                    <div class="mt-4 flex text-sm leading-6 text-gray-400">
                                        <label for="file-upload" class="relative cursor-pointer rounded-md bg-gray-800 font-semibold text-blue-400 focus-within:outline-none focus-within:ring-2 focus-within:ring-blue-500 focus-within:ring-offset-2 focus-within:ring-offset-gray-900 hover:text-blue-300">
                                            <span>Datei hochladen</span>
                                            <input id="file-upload" name="file-upload" type="file" class="sr-only">
                                        </label>
                                        <p class="pl-1">oder hierher ziehen</p>
                                    </div>
                                    <p class="text-xs leading-5 text-gray-500">PDF, PNG, JPG, ZIP bis 10MB</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-end">
                            <button type="submit" class="px-8 py-3 font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors duration-300">
                                Inhalt einreichen
                            </button>
                        </div>
                    </form>
                </div>
            `,
        reflection: `
                <div class="max-w-4xl mx-auto bg-gray-800 p-8 rounded-lg shadow-lg">
                    <h1 class="text-3xl font-bold text-white">Reflektionstermin Q3/2025</h1>
                    <p class="text-gray-400 mt-2">Nutze die SWOT- und MES-Methode, um deinen Lernfortschritt und deine Erfahrungen zu reflektieren.</p>
                    <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <h2 class="text-2xl font-semibold text-white mb-4">SWOT-Analyse</h2>
                            <div class="space-y-6">

      const navLinks = {
        trainee: [
          { label: 'Dashboard', icon: 'layout-dashboard', view: 'dashboard' },

            label: 'Berufsschul-Inhalte',
            icon: 'book-up',

          { label: 'Dashboard', icon: 'layout-dashboard', view: 'dashboard' },
          {
            label: 'Inhalts-Management',
            icon: 'folder-kanban',

          },
          {
            label: 'Quiz-Verwaltung',

          },
          { label: 'Mein Profil', icon: 'user', view: 'profile' },
        ],
      };

      // =====================================================================
      // APPLICATION LOGIC
      // =====================================================================

      function login() {
        const email = document.getElementById('email').value;
        state.currentUser = email.includes('ausbilder') ? 'trainer' : 'trainee';
        document.getElementById('login-view').classList.add('hidden-view');
        document.getElementById('app-view').classList.remove('hidden-view');
        setupAppForRole(state.currentUser);
        navigateTo('dashboard');
      }

      function logout() {
        state.currentUser = null;
        state.breadcrumbs = [];
        document.getElementById('app-view').classList.add('hidden-view');
        document.getElementById('login-view').classList.remove('hidden-view');
        switchLogin('trainee');
      }

      function setupAppForRole(role) {
        const user = mockData.profiles[role];
        document.getElementById('user-name').textContent = user.fullName;
        document.getElementById('user-role').textContent =
          user.role.charAt(0).toUpperCase() + user.role.slice(1);
        document.getElementById('user-avatar').src = user.avatar;

        if (role === 'trainee') {
          const startDate = new Date(user.training_start_date);
          const now = new Date('2025-08-12T15:38:00');
          const diffTime = Math.abs(now - startDate);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          state.currentTrainingYear = Math.floor(diffDays / 365) + 1;
        }

        const hasNotifications =
          role === 'trainer' &&
          mockData.quizSubmissions.some(s => s.status === 'submitted');
        document.getElementById('notification-dot').style.display =
          hasNotifications ? 'flex' : 'none';

        const navContainer = document.getElementById('sidebar-nav');
        navContainer.innerHTML = navLinks[role]
          .map(
            link => `
                <a href="#" onclick="event.preventDefault(); navigateTo('${link.view}')" class="flex items-center px-3 py-3 text-sm font-medium rounded-md text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">
                    <i data-lucide="${link.icon}" class="w-5 h-5 mr-3"></i>
                    <span>${link.label}</span>
                </a>`
          )
          .join('');

        const switcherContainer = document.getElementById(
          'role-switcher-container'
        );
        switcherContainer.innerHTML =
          role === 'trainee'
            ? `<button onclick="switchRole('trainer')" class="text-sm px-3 py-2 bg-gray-800 rounded-md hover:bg-gray-700">Zur Ausbilder-Ansicht</button>`
            : `<button onclick="switchRole('trainee')" class="text-sm px-3 py-2 bg-gray-800 rounded-md hover:bg-gray-700">Zur Azubi-Ansicht</button>`;
      }

      function switchRole(newRole) {
        state.currentUser = newRole;
        setupAppForRole(newRole);
        navigateTo('dashboard');
      }

      function goBack() {
        if (state.breadcrumbs.length > 1) {
          state.breadcrumbs.pop();
          const last = state.breadcrumbs[state.breadcrumbs.length - 1];
          navigateTo(last.view, last.data, true);
        }
      }

      function navigateTo(view, data = {}, fromHistory = false) {
        if (!fromHistory) {
          if (view === 'dashboard') {
            state.breadcrumbs = [{ view, data, title: 'Dashboard' }];
          } else {
            state.breadcrumbs.push({ view, data, title: '...' });
          }
        }

        const contentArea = document.getElementById('content-area');
        const breadcrumbContainer = document.getElementById(
          'breadcrumb-container'
        );
        let htmlContent = '';
        let title = '';

        const role = state.currentUser;
        const navs = navLinks[role];

        if (role === 'trainee') {
          switch (view) {
            case 'dashboard':
              title = 'Mein Dashboard';
              htmlContent = views.traineeDashboard(state.currentTrainingYear);
              break;
            case 'moduleDetail':
              title = mockData.curriculum.find(
                m => m.moduleId === data.moduleId
              ).title;
              htmlContent = views.moduleDetail(data.moduleId);
              break;
            case 'chapterDetail':
              title = mockData.curriculum
                .find(m => m.moduleId === data.moduleId)
                .chapters.find(c => c.chapterId === data.chapterId).title;
              htmlContent = views.chapterDetail(data.moduleId, data.chapterId);
              break;
            case 'lesson':
              title = 'Lektion';
              htmlContent = views.lesson(data.lessonId);
              break;
            case 'quiz':
              title = 'Quiz';
              htmlContent = views.quiz(data.quizId);
              break;
            case 'knowledgeSubmission':
              title = 'Inhalte einreichen';
              htmlContent = views.knowledgeSubmission;
              break;
            case 'reflection':
              title = 'Reflektionen';
              htmlContent = views.reflection;
              break;
            case 'profile':
              title = 'Mein Profil';
              htmlContent = views.profile(role);
              break;
            default:
              title = 'Unbekannt';
              htmlContent = placeholder(title);
          }
        } else {
          // Trainer views
          switch (view) {
            case 'dashboard':
              title = 'Ausbilder-Dashboard';
              htmlContent = views.trainerDashboard;
              break;
            case 'traineeDetail':
              const trainee = mockData.trainees.find(
                t => t.id === data.traineeId
              );
              title = `Detailansicht: ${trainee.name}`;
              htmlContent = views.traineeDetail(data.traineeId);
              break;
            case 'acceptanceProtocol':
              title = 'Digitales Abnahmeprotokoll';
              htmlContent = views.acceptanceProtocol;
              break;
            case 'contentManagement':
              title = 'Inhalts-Verwaltung';
              htmlContent = views.contentManagement;
              break;
            case 'quizManagement':
              title = 'Quiz-Verwaltung';
              htmlContent = views.quizManagement;
              break;
            case 'profile':
              title = 'Mein Profil';
              htmlContent = views.profile(role);
              break;
            default:
              title = 'Unbekannt';
              htmlContent = placeholder(title);
          }
        }

        if (state.breadcrumbs.length > 0)
          state.breadcrumbs[state.breadcrumbs.length - 1].title = title;
        breadcrumbContainer.innerHTML = state.breadcrumbs
          .map(
            (b, i) =>
              `<span class="cursor-pointer hover:text-white" onclick="navigateToFromBreadcrumb(${i})">${b.title}</span>`
          )
          .join(
            ' <i data-lucide="chevron-right" class="inline-block w-4 h-4 -mb-px"></i> '
          );

        contentArea.innerHTML = htmlContent;
        lucide.createIcons();
      }

      function navigateToFromBreadcrumb(index) {
        const targetState = state.breadcrumbs[index];
        state.breadcrumbs = state.breadcrumbs.slice(0, index + 1);
        navigateTo(targetState.view, targetState.data, true);
      }

      function openFeedbackModal(submissionId) {
        const modalContainer = document.getElementById('modal-container');
        modalContainer.innerHTML = views.feedbackModal(submissionId);
        lucide.createIcons();
      }

      function closeModal() {
        document.getElementById('modal-container').innerHTML = '';
      }

      function submitFeedback(submissionId) {
        const feedbackText = document.getElementById('feedback_text').value;
        const submission = mockData.quizSubmissions.find(
          s => s.submissionId === submissionId
        );
        if (submission) {
          submission.status = 'reviewed';
          submission.feedback = feedbackText;
        }
        closeModal();
        const hasNotifications = mockData.quizSubmissions.some(
          s => s.status === 'submitted'
        );
        document.getElementById('notification-dot').style.display =
          hasNotifications ? 'flex' : 'none';
        const current = state.breadcrumbs[state.breadcrumbs.length - 1];
        navigateTo(current.view, current.data, true);
      }

      function switchLogin(role) {
        document.getElementById('email').value =
          role === 'trainer'
            ? 'waleri.moretz@ausbilder.de'
            : 'elias.felsing@azubi.de';
      }

      document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      });
    </script>
