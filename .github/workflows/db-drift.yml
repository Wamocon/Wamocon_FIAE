# =============================================================================
# Database drift check (read only)
# =============================================================================
# Two jobs, two trust levels. DECISION (documented in docs/release-prozess.md):
# the daily run only looks at the Preview side, because the comparison with
# public needs the Production token and the environment "Production" asks a
# reviewer for every job. A daily run that waits for an approval every day would
# be ignored, and a Production token in an unattended scheduled job is exactly
# what the security review forbade. So:
#
#   preview-drift     (daily 04:17 UTC and manually, environment "Preview",
#                      PREVIEW_DB_URL, NO Production token)
#                      scripts/db/drift-check.mjs --preview-only: ledger of
#                      public_preview against the files on master (file not applied,
#                      file changed after it was applied).
#   production-drift  (manually only, input compare_production = true,
#                      environment "Production" with reviewers, token)
#                      scripts/db/drift-check.mjs: ledger of public against the files
#                      on master (migration without file, file not applied), and
#                      scripts/db/preview-compare.mjs: structure of public against
#                      public_preview once both have applied the same migrations.
#                      Run it after a release or when something looks wrong.
#
# Limits  : - If public_preview runs ahead of public because of open branches,
#             the structure comparison is skipped and reported as a warning.
#           - Both jobs change nothing: only SELECT and a schema-only dump. They
#             repair nothing either; whoever finds a deviation writes the
#             missing migration as a file in a pull request.
#           - GitHub switches scheduled workflows off after 60 days without
#             repository activity; start it manually once then.
#
# Secrets : PREVIEW_DB_URL (environment "Preview"); SUPABASE_ACCESS_TOKEN
#           (environment "Production", production-drift only). Variable
#           SUPABASE_PROJECT_REF_PROD.
# =============================================================================

name: Database Drift

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      compare_production:
        description: 'Also compare public with the files and with public_preview (needs the approval of the environment Production)'
        required: true
        default: false
        type: boolean

concurrency:
  group: db-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview-drift:
    name: Preview drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Connection string present?
        shell: bash
        run: |
          if [ -z "${PREVIEW_DB_URL:-}" ]; then
            echo "::error::Secret PREVIEW_DB_URL is missing in the environment Preview (see docs/release-prozess.md)."
            exit 1
          fi

      - uses: ./.github/actions/cli-setup

      - name: Ledger of public_preview against the files
        shell: bash
        run: |
          set -o pipefail
          node scripts/db/drift-check.mjs --db-url-env PREVIEW_DB_URL --preview-only 2>&1 | tee drift.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Database drift (Preview)"
            echo '```'
            tail -30 drift.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  production-drift:
    name: Production drift (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.compare_production == true && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/db-setup
        with:
          project-ref: ${{ vars.SUPABASE_PROJECT_REF_PROD }}

      - name: Ledger against files
        id: ledger
        continue-on-error: true
        shell: bash
        run: node scripts/db/drift-check.mjs --linked 2>&1 | tee drift.txt; exit "${PIPESTATUS[0]}"

      - name: Structure of public against public_preview
        id: structure
        continue-on-error: true
        shell: bash
        run: node scripts/db/preview-compare.mjs --linked --only-if-same-state 2>&1 | tee compare.txt; exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        env:
          LEDGER: ${{ steps.ledger.outcome }}
          STRUCTURE: ${{ steps.structure.outcome }}
        run: |
          {
            echo "### Database drift (Production)"
            echo "- Ledger against files: $LEDGER"
            echo "- Structure comparison: $STRUCTURE"
            echo '```'
            cat drift.txt compare.txt 2>/dev/null | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error keeps both steps running; the run fails here if one was red.
      - name: Result
        if: steps.ledger.outcome == 'failure' || steps.structure.outcome == 'failure'
        run: |
          echo "::error::Drift found, details in the steps above and in the summary."
          exit 1
