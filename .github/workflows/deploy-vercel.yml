name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: set-vars
        shell: bash
        run: |
          # 1. Determine which Vercel Project ID to use
          # If we are in a PR, look at the base branch (where we want to merge)
          # If we are on a push (after merge), look at the current branch
          TARGET_BRANCH=${{ github.base_ref || github.ref_name }}

          if [[ "$TARGET_BRANCH" == "staging" ]]; then
            echo "project_id=${{ secrets.VERCEL_PROJECT_ID_STAGING }}" >> $GITHUB_OUTPUT
          else
            echo "project_id=${{ secrets.VERCEL_PROJECT_ID_PROD }}" >> $GITHUB_OUTPUT
          fi

          # 2. Determine if this is a real Production Deployment
          # We only use --prod if it's a PUSH event (which happens AFTER a merge)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "vercel_args=--prod" >> $GITHUB_OUTPUT
          else
            echo "vercel_args=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ steps.set-vars.outputs.project_id }}
          working-directory: ./
          vercel-args: ${{ steps.set-vars.outputs.vercel_args }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}