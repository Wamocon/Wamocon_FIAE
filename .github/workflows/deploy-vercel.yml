name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - staging
  pull_request: # Hinzugefügt: Läuft jetzt auch bei PRs gegen diese Branches
    branches:
      - master
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: set-vars
        shell: bash
        run: |
          # Wir nutzen github.base_ref für PRs, um das Ziel-Projekt zu bestimmen
          TARGET_BRANCH=${{ github.base_ref || github.ref_name }}
          
          if [[ "$TARGET_BRANCH" == "staging" ]]; then
            echo "project_id=${{ secrets.VERCEL_PROJECT_ID_STAGING }}" >> $GITHUB_OUTPUT
            echo "vercel_args=" >> $GITHUB_OUTPUT
          else
            echo "project_id=${{ secrets.VERCEL_PROJECT_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "vercel_args=--prod" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ steps.set-vars.outputs.project_id }}
          working-directory: ./
          vercel-args: ${{ steps.set-vars.outputs.vercel_args }}