# =============================================================================
# CI: lint, type check and tests for every pull request and every push to master
# =============================================================================
# Blocking: ESLint (next lint), tsc --noEmit, Jest with the coverage thresholds
#           from jest.config.ts.
# Advisory: Prettier on the changed files only. The repository still contains
#           hundreds of files that are not formatted, so a repository wide
#           format gate would be red from the first run on.
# Not part of this workflow: next build (Vercel builds every branch already)
#           and the database scripts (workflow db-checks, separate pull request).
# Needs no secrets. Fork pull requests are checked the same way.

name: CI

on:
  pull_request:
    branches: [master, preview]
  push:
    branches: [master, preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm test

      # The script tests also run in db-checks without installed dependencies, where
      # the tests that need JSZip are skipped. Here they all run.
      - name: Script tests
        run: npm run test:scripts

      - name: Prettier on changed files (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' 'tests/**/*.ts' 'tests/**/*.tsx' '*.ts' '*.mjs' '.github/**/*.yml')
          if [ -z "$files" ]; then
            echo "No changed files to check."
            exit 0
          fi
          echo "$files" | xargs npx prettier --check
