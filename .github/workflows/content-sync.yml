# =============================================================================
# Content sync (manual): training content between public_preview and public
# =============================================================================
# The release workflow runs this sync automatically after the structure
# migration of public. This workflow is for starting it by hand, for example to
# repeat it or to look at what a release would change.
#
# Trigger : manually only: Actions -> "Content Sync" -> Run workflow.
#           The default is a DRY RUN: the sync runs inside a transaction that is
#           rolled back and shows the exact counts. "apply" commits it.
#
# Version : the latest published release (gh release view), like the manual
#           Production deploy. The workflow first WAITS (up to 20 minutes)
#           until public has the migrations of that release.
#
# Catalog : catalog (optional) limits the run to one occupation, for example
#           KFBM (the code of a training catalog). Empty (default) = all
#           catalogs, exactly as before. In a run with a catalog each table is
#           matched by its stable codes and only the rows of that catalog are
#           read and written, see the header of scripts/db/content-sync.mjs.
#
# Update  : update_mode never (default) only inserts new rows. newer also updates
#           existing rows as configured per table; only a person starts that.
#           The release workflow never updates.
#
# Rules   : scripts/db/content-sync.mjs (header) and supabase/content-tables.json.
#           In short: only training content, additive, never deleting, user data
#           is never touched. Direction preview-to-production is the release
#           direction; production-to-preview seeds Preview with released content.
#
# Secrets : SUPABASE_ACCESS_TOKEN (environment "Production"). Variables
#           SUPABASE_PROJECT_REF_PROD, CONTENT_SYNC_OWNER_EMAIL (optional).
# =============================================================================

name: Content Sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Really apply (off = dry run, nothing is changed)'
        required: true
        default: false
        type: boolean
      direction:
        description: 'preview-to-production (release direction) or production-to-preview (seed Preview with released content)'
        required: true
        default: preview-to-production
        type: choice
        options:
          - preview-to-production
          - production-to-preview
      update_mode:
        description: 'never = only insert new rows (default); newer = also update existing rows as configured per table (newer or always) in supabase/content-tables.json'
        required: true
        default: never
        type: choice
        options:
          - never
          - newer
      catalog:
        description: 'Limit the run to one occupation: the code of a training catalog, for example KFBM. Empty = all catalogs (as before).'
        required: false
        default: ''
        type: string

concurrency:
  group: content-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Content sync ${{ inputs.apply && 'apply' || 'dry run' }}
    # Only the workflow file of master may start it; the release tag it checks out
    # must be part of master as well (require-master below)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONTENT_SYNC_OWNER_EMAIL: ${{ vars.CONTENT_SYNC_OWNER_EMAIL }}
      APPLY: ${{ inputs.apply }}
      DIRECTION: ${{ inputs.direction }}
      UPDATE_MODE: ${{ inputs.update_mode }}
      CATALOG: ${{ inputs.catalog }}
    steps:
      - name: Determine the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then empty else .tagName end')
          if [ -z "$tag" ] || ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$'; then
            echo "::error::No usable published release found."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/require-master

      - uses: ./.github/actions/db-setup
        with:
          project-ref: ${{ vars.SUPABASE_PROJECT_REF_PROD }}

      - name: Wait until public has the migrations of the release
        run: |
          for attempt in $(seq 1 40); do
            node scripts/db/supabase-retry.mjs db push --linked --dry-run > state.txt 2>&1 || true
            if grep -q "up to date" state.txt; then echo "public is on the migration state of the release."; exit 0; fi
            echo "Migrations still open (attempt $attempt of 40), waiting 30 seconds ..."
            sleep 30
          done
          echo "::error::public still lacks migrations after 20 minutes. Content sync aborted; check the release run."
          cat state.txt
          exit 1

      - name: Content sync
        run: |
          # newer = the per-table update setting of the allowlist applies
          mode=never
          if [ "$UPDATE_MODE" = "newer" ]; then mode=configured; fi
          args=(--linked --direction "$DIRECTION" --update "$mode")
          # empty = all catalogs (unchanged); otherwise the code of one occupation
          # (the same rule as parseCatalogCode in scripts/db/content-sync.mjs)
          if [ -n "$CATALOG" ]; then
            pattern='^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
            if ! [[ "$CATALOG" =~ $pattern ]]; then
              echo "::error::Invalid catalog code (letters, digits, '.', '_' and '-', 1 to 64 characters)."
              exit 1
            fi
            args+=(--catalog "$CATALOG")
          fi
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          node scripts/db/content-sync.mjs "${args[@]}"
