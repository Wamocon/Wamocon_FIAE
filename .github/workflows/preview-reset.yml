# =============================================================================
# Preview reset (manual): rebuild public_preview from the structure of public
# =============================================================================
# Trigger : manually only: Actions -> "Preview Reset" -> Run workflow.
#           The default mode is "plan": it only shows what WOULD happen.
#
# What it does (mode execute):
#   1. drops public_preview and the Preview twins (triggers and policies with
#      suffix _preview on auth and storage, cron jobs with suffix -preview)
#   2. clones the STRUCTURE of public (schema-only dump, no rows) rewritten for
#      public_preview and takes over the migration ledger of public
#   3. runs supabase/preview-setup/02-preview-side.sql (helper functions,
#      realtime, storage prefix policies)
#   4. applies the migrations of master that public does not have yet
# No production data is copied. Content comes from seed, import or the content
# sync. All Preview data is deleted. public is only read.
#
# It is also the first-time setup of public_preview, after a human ran
# supabase/preview-setup/01-preview-role.sql.
#
# When to run: migrations of closed branches linger in public_preview; a
# migration of a branch that was changed after it was applied; a broken state.
# Do not run it while other Preview runs are active (they wait on the database
# lock, but their changes would be discarded).
#
# Secrets : SUPABASE_ACCESS_TOKEN (environment "Preview"). Variable
#           SUPABASE_PROJECT_REF_PROD.
# =============================================================================

name: Preview Reset

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = only show, execute = really rebuild public_preview (deletes all Preview data)'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - execute

concurrency:
  group: preview-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: Preview reset (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MODE: ${{ inputs.mode }}
    steps:
      # Always master: public_preview is rebuilt to the state of master.
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          persist-credentials: false

      - name: Check migration files
        run: |
          node scripts/db/migration-check.mjs
          node scripts/db/preview-migrate.mjs check

      - uses: ./.github/actions/db-setup
        with:
          project-ref: ${{ vars.SUPABASE_PROJECT_REF_PROD }}

      - name: Rebuild plan
        run: node scripts/db/preview-migrate.mjs rebuild --linked | tee plan.txt

      - name: Rebuild public_preview
        if: env.MODE == 'execute'
        run: node scripts/db/preview-migrate.mjs rebuild --linked --execute | tee rebuild.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Preview reset ($MODE)"
            echo '```'
            cat rebuild.txt 2>/dev/null || cat plan.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
