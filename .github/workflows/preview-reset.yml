# =============================================================================
# Preview reset (manual): rebuild public_preview from the structure of public
# =============================================================================
# Trigger : manually only: Actions -> "Preview Reset" -> Run workflow.
#           The default mode is "plan": it only shows what WOULD happen.
#
# Two jobs, two trust levels:
#   snapshot  environment "Production" (Supabase access token, reviewers): reads
#             the schema-only structure of public and its migration ledger, READ
#             ONLY, and hands them over as a file. No data, no rows.
#   rebuild   environment "Preview" (PREVIEW_DB_URL, role app_preview_migrator, no
#             Production token): empties public_preview, clones the structure from
#             the snapshot, seeds the ledger, runs
#             supabase/preview-setup/02-preview-side.sql and applies the migrations
#             of master that public does not have yet.
# The Preview job never reads public and never sees the Production token.
#
# No production data is copied. Content comes from seed, import or the content
# sync. All Preview data is deleted. public, auth and storage are not touched.
#
# It is also the first-time setup of public_preview, after a human ran
# supabase/preview-setup/01-preview-role.sql and set the two role passwords.
# AFTER every reset a human re-runs supabase/preview-setup/03-shared-objects.sql
# (realtime membership of the recreated tables).
#
# When to run: migrations of closed branches linger in public_preview; a
# migration of a branch that was changed after it was applied; a broken state.
# Do not run it while other Preview runs are active (they wait on the database
# lock, but their changes would be discarded).
#
# Secrets : SUPABASE_ACCESS_TOKEN (environment "Production", snapshot job only),
#           PREVIEW_DB_URL (environment "Preview", rebuild job only). Variable
#           SUPABASE_PROJECT_REF_PROD.
# =============================================================================

name: Preview Reset

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = only show, execute = really rebuild public_preview (deletes all Preview data)'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - execute

concurrency:
  group: preview-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot of the structure of public (read only)
    # Only from master: the workflow file and the scripts come from the chosen ref
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false

      - uses: ./.github/actions/db-setup
        with:
          project-ref: ${{ vars.SUPABASE_PROJECT_REF_PROD }}

      - name: Read the structure of public
        shell: bash
        run: node scripts/db/preview-migrate.mjs snapshot --linked --out preview-snapshot

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-snapshot
          path: preview-snapshot
          retention-days: 1
          if-no-files-found: error

  rebuild:
    name: Preview reset (${{ inputs.mode }})
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
      MODE: ${{ inputs.mode }}
    steps:
      # Always master: public_preview is rebuilt to the state of master.
      # actions/checkout v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false

      - name: Connection string present?
        shell: bash
        run: |
          if [ -z "${PREVIEW_DB_URL:-}" ]; then
            echo "::error::Secret PREVIEW_DB_URL is missing in the environment Preview (see docs/release-prozess.md)."
            exit 1
          fi

      - name: Check migration files
        shell: bash
        run: |
          node scripts/db/migration-check.mjs
          node scripts/db/preview-migrate.mjs check

      - uses: ./.github/actions/cli-setup

      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: preview-snapshot
          path: preview-snapshot

      - name: Rebuild plan
        shell: bash
        run: |
          set -o pipefail
          node scripts/db/preview-migrate.mjs rebuild --db-url-env PREVIEW_DB_URL --snapshot preview-snapshot | tee plan.txt

      - name: Rebuild public_preview
        if: env.MODE == 'execute'
        shell: bash
        run: |
          set -o pipefail
          node scripts/db/preview-migrate.mjs rebuild --db-url-env PREVIEW_DB_URL --snapshot preview-snapshot --execute | tee rebuild.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Preview reset ($MODE)"
            echo '```'
            cat rebuild.txt 2>/dev/null || cat plan.txt 2>/dev/null || true
            echo '```'
            if [ "$MODE" = "execute" ]; then
              echo "Next: a human re-runs supabase/preview-setup/03-shared-objects.sql (realtime membership)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
