# =============================================================================
# Composite action: database tooling for the workflows
# =============================================================================
# Installs Node, installs the PINNED Supabase CLI and links the project. The
# caller job must provide SUPABASE_ACCESS_TOKEN as job environment variable
# (from the secrets of its environment), the project reference is passed as an
# input (repository variable, not a secret, not hard coded).
#
# Runs inside the caller job, so environment secrets work reliably. The repo
# must be checked out before (the action itself lives in the repository).
#
# Pinned: scripts/db/preview-cli.mjs depends on "db query --output-format json"
# and "--agent no"; a new output format once broke CI silently in another
# project. Raise the version only together with a trial run of
#   node scripts/db/preview-migrate.mjs apply --linked --plan-only
# =============================================================================
name: Database tooling
description: Node, pinned Supabase CLI and project link for the database scripts
inputs:
  project-ref:
    description: Supabase project reference (repository variable)
    required: true
  supabase-cli-version:
    description: Pinned Supabase CLI version
    required: false
    default: '2.118.0'
runs:
  using: composite
  steps:
    - name: Required configuration present?
      shell: bash
      env:
        PROJECT_REF: ${{ inputs.project-ref }}
      run: |
        if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
          echo "::error::Secret SUPABASE_ACCESS_TOKEN is missing in the environment of this job (see docs/release-prozess.md)."
          exit 1
        fi
        if [ -z "$PROJECT_REF" ]; then
          echo "::error::Repository variable SUPABASE_PROJECT_REF_PROD is not set (see docs/release-prozess.md)."
          exit 1
        fi
        if ! printf '%s' "$PROJECT_REF" | grep -Eq '^[a-z0-9]{15,30}$'; then
          echo "::error::The project reference does not look like a Supabase reference."
          exit 1
        fi

    # actions/setup-node v4.4.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22

    # supabase/setup-cli v1.7.3
    - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
      with:
        version: ${{ inputs.supabase-cli-version }}

    # All CLI calls that talk to the database go through scripts/db/supabase-retry.mjs:
    # it repeats ONLY a rejected login (cli_login_postgres), see its header.
    - name: Link the project
      shell: bash
      env:
        PROJECT_REF: ${{ inputs.project-ref }}
      run: node scripts/db/supabase-retry.mjs link --project-ref "$PROJECT_REF"
